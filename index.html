<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F4EEE4">
<title>TALK GAME TALK</title>
<style>
:root{
  --accent:#F36A2D;
  --bg:#F4EEE4;
  --ink:#1D1C1A;
  --muted:#756E65;
  --surface:rgba(255,253,248,.88);
  --surface-solid:#FFFDF8;
  --line:rgba(29,28,26,.12);
  --line-strong:rgba(29,28,26,.2);
  --shadow-card:0 18px 48px rgba(62,48,32,.10),0 2px 8px rgba(62,48,32,.06);
  --shadow-button:0 8px 20px rgba(243,106,45,.22);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --action-lift:clamp(64px,10dvh,92px);
  --ad-safety-gap:clamp(26px,3.4dvh,36px);
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;min-height:100%;
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body{min-height:100dvh;overflow:hidden}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.shell{
  width:min(100%,680px);height:100dvh;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:clamp(8px,1.2dvh,12px);
  padding:max(8px,env(safe-area-inset-top)) 16px max(8px,env(safe-area-inset-bottom));
}

header{text-align:center;padding-top:0}
.logo{
  font-weight:950;line-height:.84;letter-spacing:-.055em;
  font-size:clamp(28px,7.6vw,42px);
}
.logo span{display:block}.logo .game{color:var(--accent)}
.tag{
  margin-top:8px;font-size:11px;color:var(--muted);
  font-weight:750;letter-spacing:.16em;
}
.viewport{position:relative;min-height:0}
.screen{display:grid;height:100%;grid-template-rows:minmax(0,1fr) auto;gap:6px}
#questionScreen{display:none}
.stage{display:flex;align-items:flex-start;justify-content:center;min-height:0;padding-block:0}
.card{
  width:min(100%,560px);height:auto;min-height:29dvh;max-height:35dvh;
  border:1px solid var(--line-strong);border-radius:26px;
  background:var(--surface);box-shadow:var(--shadow-card);
  padding:clamp(22px,5vw,34px) clamp(20px,5vw,32px);
  display:flex;align-items:center;justify-content:center;
  text-align:center;position:relative;overflow:hidden;
  margin-inline:auto;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.card::before{
  content:"";position:absolute;top:0;left:26px;right:26px;height:4px;
  border-radius:0 0 999px 999px;background:var(--accent);
}
.question{
  max-width:13em;font-size:clamp(24px,6vw,38px);line-height:1.32;
  font-weight:850;letter-spacing:-.045em;text-wrap:balance;
}
.startText{
  max-width:9em;
  font-size:clamp(40.5px,10.2vw,60px);
  line-height:1.20;
  letter-spacing:-.055em;
  text-wrap:balance;
}
.startText .copy-line{display:block}
.counter{
  position:absolute;bottom:16px;right:18px;
  min-width:62px;padding:6px 9px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.55);
  font-size:11px;letter-spacing:.05em;color:var(--muted);font-weight:800;
}
.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.22fr);gap:12px;margin-top:-4px;transform:translateY(calc(-1 * var(--action-lift)))}
.question-screen .controls{transform:translateY(calc(-1 * (var(--action-lift) + var(--ad-safety-gap))))}
.nav{
  min-height:64px;border-radius:16px;border:1px solid var(--line-strong);
  background:rgba(255,253,248,.72);color:var(--ink);
  font-weight:850;font-size:17px;letter-spacing:-.015em;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 14px;
  transition:transform 140ms var(--ease-out),background-color 180ms ease,border-color 180ms ease,box-shadow 180ms ease;
  touch-action:manipulation;
}
.nav.next{
  color:#171310;background:var(--accent);border-color:rgba(29,28,26,.10);
  box-shadow:var(--shadow-button);
}
.nav:active{transform:scale(.97)}
.start-controls{grid-template-columns:1fr}
.start-controls .nav{min-height:68px;font-size:19px}
.ad{
  width:min(320px,100%);min-height:50px;margin:-4px auto 0;transform:translateY(calc(-1 * var(--action-lift)));
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0;background:transparent;border:0;overflow:visible;
}
@media (hover:hover) and (pointer:fine){
  .nav:hover{background:rgba(255,253,248,.95);border-color:rgba(29,28,26,.28)}
  .nav.next:hover{background:#FA763D;border-color:rgba(29,28,26,.14);box-shadow:0 10px 24px rgba(243,106,45,.28)}
}
@media(max-height:760px){
  :root{--ad-safety-gap:24px}
  .shell{gap:8px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .tag{margin-top:7px;font-size:10px}
  .card{width:min(100%,540px);min-height:27dvh;max-height:32dvh;border-radius:22px;padding:20px 18px}.card::before{left:22px;right:22px}
  .question{font-size:clamp(22px,5.6vw,34px)}
  .nav{min-height:60px;font-size:16px}.start-controls .nav{min-height:62px;font-size:18px}.ad{min-height:46px}
}
@media(max-height:650px){
  :root{--ad-safety-gap:20px}
  .tag{display:none}.logo{font-size:clamp(25px,6.8vw,36px)}
  .card{min-height:25dvh;max-height:30dvh}
  .controls{gap:8px}.nav{min-height:54px;font-size:15px}.ad{min-height:42px}
}
@media(prefers-reduced-motion:reduce){
  .nav{transition:background-color 120ms ease,border-color 120ms ease,box-shadow 120ms ease}
  .nav:active{transform:none}
}

/* Question transition */
.card{will-change:transform,opacity}
.card.anim-out-next{animation:tgtOutNext 150ms cubic-bezier(.4,0,1,1) both}
.card.anim-in-next{animation:tgtInNext 240ms var(--ease-out) both}
.card.anim-out-prev{animation:tgtOutPrev 150ms cubic-bezier(.4,0,1,1) both}
.card.anim-in-prev{animation:tgtInPrev 240ms var(--ease-out) both}
@keyframes tgtOutNext{to{transform:translateX(-22px) scale(.985);opacity:0}}
@keyframes tgtInNext{from{transform:translateX(28px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@keyframes tgtOutPrev{to{transform:translateX(22px) scale(.985);opacity:0}}
@keyframes tgtInPrev{from{transform:translateX(-28px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){
  .card.anim-out-next,.card.anim-in-next,.card.anim-out-prev,.card.anim-in-prev{animation:none}
}

</style>
</head>
<body>
<div class="shell">
<header>
  <div class="logo"><span>TALK</span><span class="game">GAME</span><span>TALK</span></div>
  <div class="tag">1 TAP, 1 QUESTION, MORE TALK.</div>
</header>
<div class="viewport">
  <section class="screen" id="startScreen">
    <main class="stage">
      <article class="card">
        <div class="question startText" aria-label="ゲームの思い出から、会話がはじまる。">
          <span class="copy-line">ゲームの</span>
          <span class="copy-line">思い出から、</span>
          <span class="copy-line">会話が</span>
          <span class="copy-line">はじまる。</span>
        </div>
      </article>
    </main>
    <nav class="controls start-controls">
      <a class="nav next" id="startBtn" href="#q1">お題を出す →</a>
    </nav>
  </section>
  <section class="screen question-screen" id="questionScreen">
    <main class="stage">
      <article class="card" id="questionCard">
        <div class="question" id="questionText"></div>
        <div class="counter" id="counter"></div>
      </article>
    </main>
    <nav class="controls">
      <a class="nav" id="prevBtn" href="#start">← 最初へ</a>
      <a class="nav next" id="nextBtn" href="#q2">次のお題 →</a>
    </nav>
  </section>
</div>
<div class="ad" aria-label="広告">
  <script type="text/javascript" src="https://j.zucks.net.zimg.jp/j?f=737274"></script>
</div>
</div>
<script>
(() => {
  const questions=["初めて徹夜したゲームは？","子どもの頃、一番遊んだゲームは？","初めて自分で買ったゲームは？","一番長く遊んだゲームは？","友達と一番盛り上がったゲームは？","セーブせずに進んで後悔した思い出は？","一番印象に残っているNPCは？","一番達成感があったゲームは？","一番緊張したボス戦は？","期待しすぎて合わなかったゲームは？","戦闘だけで何時間でも遊べると思ったゲームは？","ゲームのために予定をずらしたことはある？","攻略情報を見ずに遊んでよかったと思うゲームは？","今までで一番『自分、ゲーム好きだな』と思った瞬間は？","ゲームのアイテムを1つだけ現実に持ち込めるなら何がいい？","ゲームの職業を1つ選んで現実で働くなら何を選ぶ？","ゲームがきっかけで始めた趣味はある？","ゲームオーバーのペナルティは重い方がいい？","気づいたら朝になっていたゲームは？","ゲームで本気で誰かに感謝したことはある？","育成が一番楽しかったゲームは？","収集が止まらなくなったゲームは？","今まで一番泣けたゲームは？","無人島にゲームを1本だけ持っていけるなら、どんなゲーム？","一番笑ったゲームの思い出は？","難易度は高いほど面白い？","キャラメイクと固定主人公、どっちが好き？","探索しているだけで楽しかったゲームは？","今までで一番操作していて気持ちよかったゲームは？","オンライン要素はなくてもいい？","記憶を消して、もう一度遊びたいゲームは？","親に隠れて遊んだゲームの思い出は？","ゲームの発売延期はどこまで許せる？","一番しょうもない理由でやめたゲームは？","最後まで嫌いになれなかった敵は？","ゲーム中に思わず声が出た瞬間は？","クリア後のやり込みは必要？","自分がラスボスになるなら、どんな能力を持ちたい？","自力で見つけたとき嬉しかった隠し要素は？","主人公は無口とよく喋るタイプ、どっちが好き？","クリアした瞬間に放心したゲームは？","一番好きだったゲームの世界は？","逆に、絶対に住みたくないゲーム世界は？","途中で投げたことを少し後悔しているゲームは？","一生にあと3本しかゲームを遊べないなら、どう選ぶ？","一番悔しかったゲームの思い出は？","ロード時間とグラフィック、どっちを優先してほしい？","積んだまま何年も気になっているゲームは？","リメイクで内容を大きく変えるのはアリ？","今、一番遊びたいのに時間が足りないゲームは？","自分の人生の一時期と強く結びついているゲームは？","対人戦と協力プレイ、どっちが好き？","みんな評価しているけど、自分には合わなかったゲームは？","寄り道ばかりして本編が進まなかったゲームは？","ボイスはフルボイスの方がいい？","一番好きだったゲームの街や拠点は？","一番守りたくなったキャラクターは？","エンディングが忘れられないゲームは？","それでもゲームを続けている理由は？","取り返しのつかない要素はアリ？ナシ？","チュートリアルは丁寧な方がいい？それとも放っておいてほしい？","人生を変えたゲームは？","子どもの頃と今で評価が変わったゲームは？","昔の友達を思い出すゲームは？","攻略情報を見るのはアリ？ナシ？","説明書を読まずに始めて困ったゲームは？","一番感情移入した主人公はどんなタイプ？","一番好きだった悪役は？","一番意味不明だったゲームの思い出は？","ゲームはクリアまで遊ばなくてもいい？","音楽を聴くだけで場面が浮かぶゲームは？","大切な人に一度は遊んでほしいゲームは？","ゲームから教わったことはある？","一番好きだった相棒キャラは？","自分がゲームの主人公になるなら、どんなジャンルがいい？","実績やトロフィーは気にする？","今でもタイトルを聞くだけで懐かしくなるゲームは？","逆に、評価は低いけど自分は大好きなゲームは？","オープンワールドと一本道、どっちが好き？","ゲーム内のミニゲームに本編以上にハマったことはある？","ゲームを通して仲良くなった人はいる？","家族との思い出があるゲームは？","人にはちょっと言いづらいくらいハマったゲームは？","一番許せなかった裏切りキャラは？","住めるなら、どんなゲーム世界に住みたい？","ゲームにファストトラベルは必要？","買って後悔したゲームはある？","10年後もゲームを遊んでいると思う？","ゲームをやめようと思った時期はある？","初見では絶対わからないと思った仕掛けは？","一番笑えるバグに遭遇したことは？","一度だけゲームの能力を現実で使えるなら、どんな能力がいい？","攻略情報を見ればよかったと思ったゲームは？","一番しょうもない理由でキレたゲームは？","ストーリー重視とゲーム性重視、どっち？","ゲームは1人で遊ぶ方が好き？誰かと遊ぶ方が好き？","コントローラーを強く握りすぎたことはある？","一生ひとつのジャンルしか遊べないなら何を選ぶ？","今の自分だからこそ、もう一度遊びたいゲームは？","一番怖かったゲームは？"];
  const start=document.getElementById('startScreen');
  const screen=document.getElementById('questionScreen');
  const card=document.getElementById('questionCard');
  const text=document.getElementById('questionText');
  const counter=document.getElementById('counter');
  const startBtn=document.getElementById('startBtn');
  const prev=document.getElementById('prevBtn');
  const next=document.getElementById('nextBtn');
  let current=0,moving=false;

  const setMode=(questionMode)=>{start.style.display=questionMode?'none':'grid';screen.style.display=questionMode?'grid':'none';};
  const render=(n)=>{
    current=Math.max(1,Math.min(100,n));
    text.textContent=questions[current-1];
    counter.textContent=`${current} / 100`;
    prev.textContent=current===1?'← 最初へ':'← 前のお題';
    prev.href=current===1?'#start':`#q${current-1}`;
    next.textContent=current===100?'もう一周 →':'次のお題 →';
    next.href=current===100?'#q1':`#q${current+1}`;
    setMode(true);
  };
  const fromHash=()=>{
    const m=location.hash.match(/^#q(\d+)$/);
    if(m) render(Number(m[1])); else setMode(false);
  };
  const animateTo=(target,dir)=>{
    if(moving)return;
    moving=true;
    const outClass=dir==='next'?'anim-out-next':'anim-out-prev';
    const inClass=dir==='next'?'anim-in-next':'anim-in-prev';
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finish=()=>{
      card.classList.remove('anim-out-next','anim-out-prev');
      location.hash=target;
      requestAnimationFrame(()=>{
        card.classList.remove('anim-in-next','anim-in-prev');
        if(reduced){moving=false;return;}
        void card.offsetWidth;
        card.classList.add(inClass);
        const done=()=>{card.classList.remove(inClass);moving=false;};
        card.addEventListener('animationend',done,{once:true});
        setTimeout(done,320);
      });
    };
    if(reduced){location.hash=target;moving=false;return;}
    card.classList.add(outClass);
    card.addEventListener('animationend',finish,{once:true});
    setTimeout(finish,210);
  };

  startBtn.addEventListener('click',e=>{e.preventDefault();location.hash='#q1';});
  prev.addEventListener('click',e=>{
    e.preventDefault();
    if(current===1){location.hash='#start';return;}
    animateTo(`#q${current-1}`,'prev');
  });
  next.addEventListener('click',e=>{
    e.preventDefault();
    const target=current===100?'#q1':`#q${current+1}`;
    animateTo(target,'next');
  });
  addEventListener('hashchange',fromHash);
  fromHash();
})();
</script>
</body>
</html>
