<style>

*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--sky-2);color:var(--paper-ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

button,a{font:inherit;color:inherit}

.app{
  position:relative;
  width:min(100%,680px);
  height:100dvh;
  margin:0 auto;
  overflow:hidden;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  gap:10px;
  padding:max(8px,env(safe-area-inset-top)) 14px max(8px,env(safe-area-inset-bottom));
  isolation:isolate;
}
.app::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-4;
  background:
    linear-gradient(to bottom,rgba(255,255,255,.12),transparent 22%),

}
.app::after{
  content:"";
  position:absolute;
  left:0;
  right:0;

  height:28%;

  opacity:.18;
  background:

}
.pixel-cloud{
  position:absolute;
  width:76px;height:18px;

.pixel-cloud.one{top:15%;left:-20px}
.pixel-cloud.two{top:29%;right:-26px;transform:scale(.72)}

header{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:flex-start;

}
.logo{

  line-height:.82;

  font-size:clamp(29px,7.7vw,43px);
  color:var(--white);

    2px 0 0 var(--blue-deep),
    -2px 0 0 var(--blue-deep),
    0 -2px 0 var(--blue-deep),
    3px 4px 0 rgba(8,35,78,.38);
}
.logo span{display:block}
.logo .game{
  color:#FFD45F;
  text-shadow:
    0 3px 0 #8E5A17,
    2px 0 0 #8E5A17,
    -2px 0 0 #8E5A17,
    0 -2px 0 #8E5A17,
    3px 4px 0 rgba(8,35,78,.38);
}
.logo::after{
  content:"";
  display:block;
  width:74px;
  height:4px;
  margin:11px auto 0;
  background:var(--gold);
  box-shadow:-8px 0 0 var(--blue-deep),8px 0 0 var(--blue-deep),0 3px 0 rgba(8,35,78,.35);
}
.tag{display:none}
.brand{text-align:center}
.lang-toggle{
  position:absolute;
  right:0;
  top:2px;
  display:flex;
  align-items:center;
  padding:3px;
  border:2px solid rgba(255,255,255,.8);
  background:rgba(13,59,120,.50);
  box-shadow:0 3px 0 rgba(5,31,71,.35);
}
.lang-btn{
  border:0;
  background:transparent;
  color:rgba(255,255,255,.72);
  font-size:10px;
  font-weight:900;
  padding:5px 7px;
  cursor:pointer;
}
.lang-btn.active{background:var(--paper);color:var(--blue-deep)}

.viewport{position:relative;min-height:0}
.screen{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px}
#startScreen{grid-template-rows:auto auto;align-content:start;gap:10px}
#questionScreen{display:none}
.stage{display:flex;align-items:flex-start;justify-content:center;min-height:0;padding-top:2px}
#startScreen .stage{padding-top:0}

.card{
  --corner:14px;
  width:min(100%,560px);
  min-height:30dvh;
  max-height:37dvh;
  padding:clamp(27px,6vw,40px) clamp(20px,5vw,34px) clamp(32px,7vw,44px);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;

}
.card::before,.card::after{
  content:"";
  position:absolute;
  width:9px;height:9px;
  background:var(--gold);
  box-shadow:0 0 0 2px var(--blue-deep);
}
.card::before{top:9px;left:9px}
.card::after{right:9px;bottom:9px}
.question{
  max-width:14em;
  font-size:clamp(23px,5.8vw,36px);
  line-height:1.40;
  font-weight:850;
  letter-spacing:-.035em;
  color:var(--paper-ink);
  text-wrap:balance;
}
.startText{
  max-width:9em;
  font-size:clamp(34px,8.8vw,52px);
  line-height:1.22;
  letter-spacing:-.05em;
}
.startText .copy-line{display:block}
.startText.en{max-width:10.5em;font-size:clamp(31px,8vw,47px);line-height:1.13;letter-spacing:-.045em}
.question.en{max-width:16em;letter-spacing:-.025em}
.counter{
  position:absolute;
  right:15px;
  bottom:13px;
  min-width:58px;
  padding:4px 7px;
  border:2px solid var(--blue-deep);
  background:#E8F4FF;
  color:var(--blue-deep);
  font-size:10px;
  font-weight:900;
  letter-spacing:.04em;
}

.controls{
  width:min(100%,560px);
  margin-inline:auto;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1.18fr);
  gap:12px;
}
.start-controls{grid-template-columns:1fr;margin-top:-4px}
.nav{
  position:relative;
  min-height:60px;
  border:3px solid #EAF7FF;
  outline:3px solid var(--blue-deep);
  background:linear-gradient(#258BE8,#176CC6);
  color:#fff;
  font-weight:900;
  font-size:16px;
  letter-spacing:-.01em;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px 13px;
  cursor:pointer;
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.24),
    0 5px 0 #073467,
    0 8px 14px rgba(4,45,96,.18);
  transition:transform 85ms var(--ease-out),filter 85ms ease,box-shadow 85ms ease,border-color 85ms ease;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 3px,100% 3px,100% calc(100% - 8px),calc(100% - 3px) calc(100% - 8px),calc(100% - 3px) 100%,8px 100%,8px calc(100% - 3px),0 calc(100% - 3px),0 8px,3px 8px,3px 3px,8px 3px);
}
.nav.next{background:linear-gradient(#2D94EE,#126AC9)}
.start-controls .nav{
  min-height:68px;
  max-width:430px;
  width:100%;
  margin:auto;
  border-color:var(--gold-hi);
  outline-color:#8A5C17;
  background:linear-gradient(#349AF0,#176FD0);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.28),
    0 0 0 3px var(--gold),
    0 6px 0 #765018,
    0 10px 18px rgba(4,45,96,.22);
  font-size:19px;
}
.nav::before{
  content:"";
  position:absolute;
  left:7px;
  top:50%;
  width:0;height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-left:8px solid transparent;
  transform:translateY(-50%);
  opacity:0;
}
.nav:hover::before,.nav:focus-visible::before,.nav.tap-animate::before{
  border-left-color:var(--gold-hi);
  opacity:1;
}
.nav:active,.nav.tap-animate{
  transform:translateY(3px) scale(.985);
  filter:brightness(.94);
  box-shadow:
    inset 0 3px 0 rgba(255,255,255,.18),
    0 2px 0 #073467,
    0 4px 8px rgba(4,45,96,.14);
}
.start-controls .nav:active,.start-controls .nav.tap-animate{
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.18),
    0 0 0 3px var(--gold),
    0 2px 0 #765018,
    0 5px 8px rgba(4,45,96,.15);
}

.ad-board{
  width:min(344px,100%);
  min-height:70px;
  margin:0 auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.04),transparent 16%,rgba(255,255,255,.04) 32%,transparent 50%,rgba(255,255,255,.035) 70%,transparent),
    #795037;
  border:4px solid var(--wood-dark);
  outline:3px solid #B7804D;
  box-shadow:0 5px 0 rgba(39,22,17,.42);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 3px,100% 3px,100% calc(100% - 8px),calc(100% - 3px) calc(100% - 8px),calc(100% - 3px) 100%,8px 100%,8px calc(100% - 3px),0 calc(100% - 3px),0 8px,3px 8px,3px 3px,8px 3px);
}
.ad{
  width:320px;
  max-width:100%;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:rgba(255,248,220,.10);
}
.ad-board::before,.ad-board::after{
  content:"";
  position:absolute;
  top:6px;
  width:5px;height:5px;
  background:#D6A861;
  box-shadow:0 0 0 2px #4D2F20;
  pointer-events:none;
}
.ad-board::before{left:7px}.ad-board::after{right:7px}

.card.anim-out-next{animation:tgtOutNext 150ms cubic-bezier(.4,0,1,1) both}
.card.anim-in-next{animation:tgtInNext 240ms var(--ease-out) both}
.card.anim-out-prev{animation:tgtOutPrev 150ms cubic-bezier(.4,0,1,1) both}
.card.anim-in-prev{animation:tgtInPrev 240ms var(--ease-out) both}
@keyframes tgtOutNext{to{transform:translateX(-22px) scale(.985);opacity:0}}
@keyframes tgtInNext{from{transform:translateX(28px) scale(.985);opacity:0}to{transform:none;opacity:1}}
@keyframes tgtOutPrev{to{transform:translateX(22px) scale(.985);opacity:0}}
@keyframes tgtInPrev{from{transform:translateX(-28px) scale(.985);opacity:0}to{transform:none;opacity:1}}

@media(hover:hover) and (pointer:fine){
  .nav:hover{filter:brightness(1.06)}
}
@media(max-height:760px){
  .app{gap:7px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
  header{min-height:84px}
  .logo{font-size:clamp(26px,6.9vw,37px)}
  .logo::after{margin-top:8px}
  .screen{gap:10px}
  .card{min-height:27dvh;max-height:33dvh;padding:22px 18px 30px}
  .question{font-size:clamp(21px,5.4vw,31px)}
  .startText{font-size:clamp(31px,8vw,44px)}
  .nav{min-height:54px;font-size:15px}
  .start-controls .nav{min-height:60px;font-size:18px}
  .ad-board{min-height:64px;padding:6px 8px}
}
@media(max-height:650px){
  header{min-height:70px}
  .logo{font-size:clamp(24px,6.4vw,33px)}
  .logo::after{margin-top:6px;height:3px}
  .screen{gap:8px}
  .card{min-height:24dvh;max-height:29dvh;padding:18px 16px 27px}

@media(max-width:390px){

  .nav{font-size:14px;padding-inline:9px}
}
@media(prefers-reduced-motion:reduce){
  .card.anim-out-next,.card.anim-in-next,.card.anim-out-prev,.card.anim-in-prev{animation:none}
  .nav{transition:filter 85ms ease,box-shadow 85ms ease}
}
</style>

const ui={
  ja:{
    start:['ゲームの','思い出から、','会話が','はじまる。'],
    startBtn:'お題を出す →',
    first:'← 最初へ',
    prev:'← 前のお題',
    next:'次のお題 →',
    again:'もう一周 →'
  },
  en:{
    start:['GAME MEMORIES','START','CONVERSATIONS.'],
    startBtn:'GET A QUESTION →',
    first:'← START',
    prev:'← PREVIOUS',
    next:'NEXT QUESTION →',
    again:'ONE MORE ROUND →'
  }
};

const $=id=>document.getElementById(id);
const startScreen=$('startScreen');
const questionScreen=$('questionScreen');
const startText=$('startText');
const questionCard=$('questionCard');
const questionText=$('questionText');
const counter=$('counter');
const startBtn=$('startBtn');
const prevBtn=$('prevBtn');
const nextBtn=$('nextBtn');
const jpBtn=$('jpBtn');
const enBtn=$('enBtn');

let current=0;
let moving=false;
let lang=localStorage.getItem('tgt-lang')==='en'?'en':'ja';

const questions=()=>lang==='ja'?ja:en;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function renderStart(){
  const t=ui[lang];
  startText.className='question startText'+(lang==='en'?' en':'');
  startText.innerHTML=t.start.map(line=>`<span class="copy-line">${esc(line)}</span>`).join('');
  startBtn.textContent=t.startBtn;
  startBtn.href='#q1';
}

function render(n){
  const list=questions();
  current=Math.min(list.length,Math.max(1,Number(n)||1));
  questionText.className='question'+(lang==='en'?' en':'');
  questionText.textContent=list[current-1];
  counter.textContent=`${current} / ${list.length}`;
  const t=ui[lang];
  prevBtn.textContent=current===1?t.first:t.prev;
  nextBtn.textContent=current===list.length?t.again:t.next;
  prevBtn.href=current===1?'#start':`#q${current-1}`;
  nextBtn.href=current===list.length?'#q1':`#q${current+1}`;
}

function showStart(){
  current=0;
  questionScreen.style.display='none';
  startScreen.style.display='grid';
}
function showQuestion(n){
  startScreen.style.display='none';
  questionScreen.style.display='grid';
  render(n);
}
function route(){
  const m=location.hash.match(/^#q(\d+)$/);
  if(m) showQuestion(Number(m[1]));
  else showStart();
}

function animateCard(target,direction){
  if(moving) return;
  moving=true;
  const outClass=direction==='prev'?'anim-out-prev':'anim-out-next';
  const inClass=direction==='prev'?'anim-in-prev':'anim-in-next';
  questionCard.classList.remove('anim-out-next','anim-in-next','anim-out-prev','anim-in-prev');
  void questionCard.offsetWidth;
  questionCard.classList.add(outClass);

  let outFinished=false;
  let outTimer;
  const finishOut=()=>{
    if(outFinished) return;
    outFinished=true;
    clearTimeout(outTimer);
    questionCard.removeEventListener('animationend',finishOut);
    questionCard.classList.remove(outClass);
    render(target);
    if(location.hash!==`#q${current}`) history.pushState(null,'',`#q${current}`);
    void questionCard.offsetWidth;
    questionCard.classList.add(inClass);

    let inFinished=false;
    let inTimer;
    const finishIn=()=>{
      if(inFinished) return;
      inFinished=true;
      clearTimeout(inTimer);
      questionCard.removeEventListener('animationend',finishIn);
      questionCard.classList.remove(inClass);
      moving=false;
    };
    questionCard.addEventListener('animationend',finishIn,{once:true});
    inTimer=setTimeout(finishIn,290);
  };
  questionCard.addEventListener('animationend',finishOut,{once:true});
  outTimer=setTimeout(finishOut,190);
}

function tap(el){
  el.classList.remove('tap-animate');
  void el.offsetWidth;
  el.classList.add('tap-animate');
  setTimeout(()=>el.classList.remove('tap-animate'),150);
}
[startBtn,prevBtn,nextBtn].forEach(el=>{
  el.addEventListener('pointerdown',()=>tap(el),{passive:true});
});

startBtn.addEventListener('click',e=>{
  e.preventDefault();
  history.pushState(null,'','#q1');
  showQuestion(1);
});
prevBtn.addEventListener('click',e=>{
  e.preventDefault();
  if(moving) return;
  if(current<=1){
    history.pushState(null,'','#start');
    showStart();
  } else animateCard(current-1,'prev');
});
nextBtn.addEventListener('click',e=>{
  e.preventDefault();
  if(moving) return;
  const list=questions();
  const target=current>=list.length?1:current+1;
  animateCard(target,'next');
});

function applyLang(l){
  lang=l;
  localStorage.setItem('tgt-lang',l);
  document.documentElement.lang=l;
  document.querySelector('.ad').setAttribute('aria-label',l==='ja'?'広告':'Advertisement');
  jpBtn.classList.toggle('active',l==='ja');
  enBtn.classList.toggle('active',l==='en');
  renderStart();
  const m=location.hash.match(/^#q(\d+)$/);
  if(m) render(Number(m[1]));
}
jpBtn.addEventListener('click',()=>applyLang('ja'));
enBtn.addEventListener('click',()=>applyLang('en'));
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);

document.documentElement.dataset.version=VERSION;
applyLang(lang);
route();
})();
</script>
