,"攻略情報を見ればよかったと思ったゲームは？","一番しょうもない理由でキレたゲームは？","ストーリー重視とゲーム性重視、どっち？","ゲームは1人で遊ぶ方が好き？誰かと遊ぶ方が好き？","コントローラーを強く握りすぎたことはある？","一生ひとつのジャンルしか遊べないなら何を選ぶ？","今の自分だからこそ、もう一度遊びたいゲームは？","一番怖かったゲームは？"];
const en=["What game first kept you up all night?","What game did you play the most as a kid?","What was the first game you bought with your own money?","What game have you spent the most time playing?","What game did you have the most fun playing with friends?","When did you regret pushing on without saving?","Which NPC has stuck with you the most?","What game gave you the biggest sense of accomplishment?","What was your most nerve-racking boss fight?","What game didn't click with you after you got too hyped for it?","What game could you play for hours just for the combat?","Have you ever changed your plans just to play a game?","What game are you glad you played without looking anything up?","When did you most think, ‘Yeah, I really love games’?","If you could bring one game item into real life, what would it be?","If you had to work in real life as one game class, what would you choose?","Did a game ever inspire you to pick up a new hobby?","Should game-over penalties be harsh?","What game made you suddenly realize it was morning?","Have you ever felt genuinely grateful to someone because of a game?","What game had the most fun character progression?","What game made collecting things impossible to stop?","What game made you cry the most?","If you could take one game to a desert island, what kind would it be?","What's your funniest gaming memory?","Does higher difficulty make a game more fun?","Do you prefer creating your own character or playing a fixed protagonist?","What game was fun just to explore?","What game simply felt the best to control?","Are you fine with games having no online features?","What game would you erase from your memory just to experience again?","What game did you secretly play when your parents weren't around?","How much of a release delay are you willing to forgive?","What's the silliest reason you've ever quit a game?","Which enemy could you never bring yourself to hate?","What gaming moment actually made you shout out loud?","Do games
